name: Build iOS IPA (Free / No Code Signing)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/connect-firebase

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q Zoomies.ipa Payload
          mv Zoomies.ipa ../../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoomies-iOS-IPA
          path: Zoomies.ipa
          retention-days: 7

